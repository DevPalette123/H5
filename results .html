<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>نتائج تقييم الملتقى التحصيلي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#25282E;--mut:#636A75;--mag:#1F4F4C;--vio:#2E6F6B;--tea:#7FB3AE;--bg:#F2F3F5;--line:#D9DCE1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
header{background:#fff;border-bottom:4px solid var(--vio);padding:14px 20px;display:flex;align-items:center;gap:16px}
header img{height:52px}header h1{font-family:"Noto Naskh Arabic",serif;font-size:24px;font-weight:700;color:var(--vio)}header small{color:var(--mut);display:block;font-size:13px;font-weight:400}
.w{max-width:960px;margin:0 auto;padding:24px 16px 60px}
.login{max-width:380px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:30px;text-align:center}
.login input{width:100%;font:inherit;padding:13px 16px;border:1.5px solid var(--line);border-radius:4px;margin:16px 0;text-align:center}
.btn{font:inherit;font-weight:600;border:0;border-radius:4px;padding:12px 34px;color:#fff;cursor:pointer;background:var(--vio)}
.err{color:#B03A3A;font-size:14px;min-height:1.4em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.k{background:#fff;border:1px solid var(--line);border-radius:6px;padding:20px}
.k b{display:block;font-size:44px;line-height:1.1;font-weight:700;color:var(--vio)}.k span{color:var(--mut);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}
.c{background:#fff;border:1px solid var(--line);border-radius:6px;padding:20px}
.c h2{font-size:16px;font-weight:600;margin-bottom:14px}
.r{display:grid;grid-template-columns:86px 1fr 38px;align-items:center;gap:10px;margin:9px 0;font-size:14.5px}
.r div{height:12px;background:#F0ECF6;border-radius:12px;overflow:hidden}.r i{display:block;height:100%;background:linear-gradient(90deg,var(--mag),var(--tea));border-radius:12px}
.r em{font-style:normal;color:var(--mut);text-align:left}
.notes h2{margin:28px 0 12px;font-size:18px}
.n{background:#fff;border:1px solid var(--line);border-inline-start:5px solid var(--vio);border-radius:4px;padding:14px 18px;margin-bottom:10px}
.n small{color:var(--mut);display:block;margin-top:4px;font-size:12.5px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top button{font:inherit;background:#fff;border:1.5px solid var(--line);border-radius:4px;padding:8px 20px;cursor:pointer}
</style></head><body>

<div class="w" id="app">
<div class="login"><h2>لوحة النتائج</h2><input type="password" id="pw" placeholder="كلمة المرور" autocomplete="current-password"><button class="btn" id="go">دخول</button><div class="err" id="er"></div></div>
</div>
<script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbzhKSxNeZfPcLg8LyikJ0rx5Sgkx2l78IHDMlGzvEM5CE_dPIpl1Gz0ZanRHPuX038/exec";
const $=id=>document.getElementById(id),ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
async function load(){
  const er=$('er');er.textContent='';
  if(ENDPOINT.startsWith('PASTE_')){er.textContent='ضع رابط Apps Script في ENDPOINT داخل الملف.';return}
  $('go').disabled=true;
  try{const r=await fetch(ENDPOINT+'?key='+encodeURIComponent($('pw').value));const d=await r.json();
    if(!d.ok){er.textContent='كلمة المرور غير صحيحة.';$('go').disabled=false;return}
    sessionStorage.setItem('k',$('pw').value);show(d.rows)}
  catch(e){er.textContent='تعذّر جلب النتائج. تأكد من الرابط ومن إعداد النشر.';$('go').disabled=false}
}
function dist(rows,k,order){const c={};order.forEach(o=>c[o]=0);rows.forEach(r=>{if(r[k]in c)c[r[k]]++});
  const mx=Math.max(1,...Object.values(c));
  return order.map(o=>`<div class="r"><span>${o}</span><div><i style="width:${c[o]/mx*100}%"></i></div><em>${ar(c[o])}</em></div>`).join('')}
function show(rows){
  const n=rows.length,sc=rows.map(r=>+r.overall).filter(x=>x),avg=sc.length?(sc.reduce((a,b)=>a+b,0)/sc.length):0;
  const yes=rows.filter(r=>r.useful==='نعم، جداً').length,ex=rows.filter(r=>r.org==='ممتاز').length;
  const pc=x=>n?ar(Math.round(x/n*100))+'٪':'—';
  const notes=rows.filter(r=>r.notes).reverse();
  $('app').innerHTML=`<div class="top"><span style="color:var(--mut)">الأحدث أولاً</span><button onclick="location.reload()">تحديث</button></div>
  <div class="kpis"><div class="k"><b>${ar(n)}</b><span>عدد المشاركين</span></div><div class="k"><b>${n?ar(avg.toFixed(1)):'—'}</b><span>متوسط التقييم العام من ٥</span></div><div class="k"><b>${pc(ex)}</b><span>قيّموا التنظيم بـ«ممتاز»</span></div><div class="k"><b>${pc(yes)}</b><span>وجدوا اللقاء مفيداً جداً</span></div></div>
  <div class="grid"><div class="c"><h2>التنظيم والاستقبال</h2>${dist(rows,'org',['ممتاز','جيد جداً','جيد','مقبول'])}</div>
  <div class="c"><h2>فائدة اللقاء</h2>${dist(rows,'useful',['نعم، جداً','إلى حد ما','لا'])}</div>
  <div class="c"><h2>التقييم العام</h2>${dist(rows,'overall',['5','4','3','2','1']).replace(/<span>(\d)<\/span>/g,(m,d)=>`<span>${ar(d)} ★</span>`)}</div></div>
  <div class="notes"><h2>المقترحات والملاحظات (${ar(notes.length)})</h2>${notes.map(r=>`<div class="n">${String(r.notes).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}<small>${r.t||''}</small></div>`).join('')||'<p style="color:var(--mut)">لا توجد ملاحظات بعد.</p>'}</div>`;
}
$('go').onclick=load;$('pw').addEventListener('keydown',e=>e.key==='Enter'&&load());
if(sessionStorage.getItem('k')){$('pw').value=sessionStorage.getItem('k');load()}
</script></body></html>
